<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="monitor-token" content="{{TOKEN}}">
  <title>Colab monitor</title><link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body><main>
  <header><h1>Colab runs</h1><button id="refresh">Refresh VMs</button></header>
  <p class="muted">On demand. GPU stats now; speed over 30 seconds. No polling while idle.</p>
  <p id="status" role="status" aria-live="polite">Loading both accounts…</p>
  <div id="accounts"></div>
</main></body>
</html>
